# CNB provides Docker and registry authentication through the docker service.
# Pushes to main publish linux/amd64 images, including the NVIDIA process collector.
main:
  push:
    - docker:
        image: node:22-bookworm-slim
      services:
        - docker
      stages:
        - name: Build web UI
          script:
            - npm ci --prefix internal/site --no-audit --no-fund
            - npm run --prefix internal/site build
        - name: Build Hub and primary agents
          jobs:
            hub:
              script: sh supplemental/cnb/build-image.sh hub
            agent:
              script: sh supplemental/cnb/build-image.sh agent
            nvidia:
              script: sh supplemental/cnb/build-image.sh nvidia
        - name: Build alternative agents
          jobs:
            alpine:
              script: sh supplemental/cnb/build-image.sh alpine
            nvidia-slim:
              script: sh supplemental/cnb/build-image.sh nvidia-slim
            intel:
              script: sh supplemental/cnb/build-image.sh intel
